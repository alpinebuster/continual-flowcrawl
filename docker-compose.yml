#
# docker compose --profile clash up -d
# docker compose --profile clash down
#
networks:
  clashnet:
  v2raynet:

services:
  v2raya:
    profiles: ["v2ray"]
    image: mzz2017/v2raya:latest
    container_name: v2raya
    privileged: true
    restart: unless-stopped
    volumes:
      - /home/datum/v2raya:/etc/v2raya
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2017:2017"
      - "20170-20173:20170-20173"
    networks:
      - v2raynet

  clash:
    profiles: ["clash"]
    image: docker.io/metacubex/mihomo:Alpha
    container_name: clash
    restart: unless-stopped
    # ports:
    #   - "27890:27890"
    #   - "9090:9090" # external controller (Restful API)
    volumes:
      - ./clash_config.yaml:/root/.config/mihomo/config.yaml
      # - ./ui:/root/.config/mihomo/ui/
      - /dev/net/tun:/dev/net/tun
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # devices:
    #   - /dev/net/tun
    pid: host
    ipc: host
    # networks:
    #   - clashnet
    network_mode: "host" # `host` on Linux, `bridge` for others
    cap_add:
      - ALL

  metacubexd:
    profiles: ["clash"]
    image: ghcr.io/metacubex/metacubexd
    container_name: metacubexd
    restart: unless-stopped
    ports:
      - '9093:80'
    networks:
      - clashnet
